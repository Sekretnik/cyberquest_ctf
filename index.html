<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberQuest: OSINT & Stegano</title>
    <style>
        /* Строгий IT-дизайн: белый фон, фиолетовые акценты */
        :root {
            --bg-color: #ffffff;
            --text-color: #333333;
            --primary-color: #6b21a8; /* Глубокий фиолетовый */
            --primary-hover: #581c87;
            --card-bg: #f8fafc;
            --border-color: #e2e8f0;
            --font-main: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            --font-code: 'Courier New', Courier, monospace;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-main);
            line-height: 1.6;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: var(--primary-color);
            color: #ffffff;
            padding: 2rem 0;
            text-align: center;
            border-bottom: 4px solid #3b0764;
        }

        header h1 {
            margin: 0;
            font-family: var(--font-code);
            font-size: 2.5rem;
        }

        header p {
            margin: 0.5rem 0 0 0;
            opacity: 0.9;
        }

        .container {
            max-width: 900px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .task-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            border-left: 5px solid var(--primary-color);
        }

        .task-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.5rem;
        }

        .task-header h2 {
            margin: 0;
            font-size: 1.25rem;
            color: var(--primary-color);
        }

        .task-body p {
            margin-top: 0;
        }

        code {
            background-color: #e2e8f0;
            padding: 0.2rem 0.4rem;
            border-radius: 4px;
            font-family: var(--font-code);
            font-size: 0.9em;
        }

        .flag-input-group {
            display: flex;
            gap: 10px;
            margin-top: 1rem;
        }

        input[type="text"] {
            flex: 1;
            padding: 0.5rem;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-family: var(--font-code);
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px rgba(107, 33, 168, 0.2);
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 0.5rem 1.5rem;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        .result {
            margin-top: 0.5rem;
            font-weight: bold;
            font-size: 0.9rem;
        }
        .correct { color: #16a34a; }
        .incorrect { color: #dc2626; }

        .hidden-text { color: var(--card-bg); user-select: text; }

        .download-link {
            display: inline-block;
            margin-top: 0.5rem;
            color: var(--primary-color);
            text-decoration: none;
            font-weight: bold;
            border-bottom: 1px dashed var(--primary-color);
        }
        .download-link:hover {
            color: var(--primary-hover);
            border-bottom-style: solid;
        }
    </style>
</head>
<body>

<header>
    <h1>{ CyberQuest }</h1>
    <p>Тренировочная платформа: OSINT & Стеганография</p>
</header>

<div class="container" id="tasks-container">
    <!-- Сюда через JS будут загружены задания -->
</div>

<script>
    // Хеш-функция, чтобы скрыть флаги в исходном коде
    function getHash(str) {
        let hash = 0;
        str = str.toLowerCase();
        for (let i = 0; i < str.length; i++) {
            const char = str.charCodeAt(i);
            hash = ((hash << 5) - hash) + char;
            hash = hash & hash; // Convert to 32bit integer
        }
        return hash.toString(36);
    }

    const tasks = [
        {
            id: 1,
            title: "Задание 1: Белый кролик",
            category: "Стеганография",
            description: "Иногда секреты лежат на самом видном месте, просто они сливаются с фоном. Найди спрятанный флаг в этом блоке. <span class='hidden-text'>flag{select_all_text}</span>",
            hash: "-h9oqoy"
        },
        {
            id: 2,
            title: "Задание 2: Под капотом",
            category: "Основы Web",
            description: "Веб-страницы состоят из кода. Разработчик оставил комментарий для себя, но забыл его удалить. Изучи исходный код этой страницы (Ctrl+U).",
            hash: "40l2uy"
        },
        {
            id: 3,
            title: "Задание 3: База",
            category: "Криптография",
            description: "Хакеры часто кодируют текст. Раскодируй эту строку: <code>ZmxhZ3tiYXNlNjRfaXNfZWFzeX0=</code>. Подсказка: название шифровки состоит из слова Base и числа.",
            hash: "-ryk9p5"
        },
        {
            id: 4,
            title: "Задание 4: Геолокация",
            category: "OSINT",
            description: "Найдите точные координаты (широта и долгота с точностью до 4 знаков) Эйфелевой башни. Формат флага: <code>flag{XX.XXXX,Y.YYYY}</code>.",
            hash: "wflabl"
        },
        {
            id: 5,
            title: "Задание 5: Машина времени",
            category: "OSINT",
            description: "Интернет помнит всё. Узнайте, какая статья была главной на сайте <code>ru.wikipedia.org</code> ровно 1 января 2010 года. Формат флага: <code>flag{Название_статьи_без_пробелов}</code>.",
            hash: "bx5tff"
        },
        {
            id: 6,
            title: "Задание 6: Цифровой след",
            category: "OSINT",
            description: "Найдите публичный аккаунт на GitHub с логином <code>torvalds</code>. В каком году он присоединился к платформе? Формат флага: <code>flag{Год}</code>.",
            hash: "ph4ldc"
        },
        {
            id: 7,
            title: "Задание 7: Что внутри?",
            category: "Стеганография",
            description: "Каждый файл имеет свою 'подпись' (Magic bytes), по которой компьютер понимает его тип. Первые байты файла — <code>50 4B 03 04</code>. Какое расширение у этого файла? Формат: <code>flag{расширение}</code>.",
            hash: "-ocgt4l"
        },
        {
            id: 8,
            title: "Задание 8: DNS-шпионаж",
            category: "OSINT",
            description: "Узнайте IP-адрес публичного DNS сервера Google. Формат: <code>flag{IP}</code>.",
            hash: "-bwyn2i"
        },
        {
            id: 9,
            title: "Задание 9: Шифр Цезаря",
            category: "Криптография",
            description: "Текст сдвинут на 3 позиции по английскому алфавиту: <code>iodj{fdhvdu_flskhu}</code>. Расшифруй его.",
            hash: "n6s68v"
        },
        {
            id: 10,
            title: "Задание 10: Финальный босс",
            category: "OSINT + Стеганография",
            description: "Найдите автора этого сайта (представьте, что это 'Mr. Robot'). Поисковик Shodan позволяет искать устройства в сети. Какой порт по умолчанию использует протокол HTTP? Формат: <code>flag{порт}</code>.",
            hash: "qpjdee"
        },
        {
            id: 11,
            title: "Задание 11: За пределами",
            category: "Стеганография",
            description: "Файлы формата JPEG имеют строгую структуру и заканчиваются маркером конца файла (EOF — <code>FF D9</code>). Всё, что дописано после него, игнорируется просмотрщиками картинок. Скачай файл и загляни 'под капот' с помощью HEX-редактора или обычного текстового редактора. <br><a href='task11.jpg' download class='download-link'>⬇ Скачать task11.jpg</a>",
            hash: "-5eaxc1"
        },
        {
            id: 12,
            title: "Задание 12: Пиксельная пыль",
            category: "Стеганография",
            description: "В этой картинке текст спрятан методом LSB (Least Significant Bit). Младшие биты цветов пикселей изменены, но человеческий глаз не способен уловить разницу. Воспользуйся утилитой <code>zsteg</code>, <code>stegsolve</code> или онлайн-анализаторами (например, StegOnline). <br><a href='task12.png' download class='download-link'>⬇ Скачать task12.png</a>",
            hash: "-fr5bo5"
        }
    ];

    const container = document.getElementById('tasks-container');

    tasks.forEach(task => {
        const card = document.createElement('div');
        card.className = 'task-card';
        card.innerHTML = `
            <div class="task-header">
                <h2>${task.title} <span style="color: #64748b; font-size: 0.9rem;">[${task.category}]</span></h2>
            </div>
            <div class="task-body">
                <p>${task.description}</p>
                <div class="flag-input-group">
                    <input type="text" id="input-${task.id}" placeholder="flag{...}">
                    <button onclick="checkFlag(${task.id})">Отправить</button>
                </div>
                <div id="result-${task.id}" class="result"></div>
            </div>
        `;
        container.appendChild(card);
    });

    function checkFlag(id) {
        const input = document.getElementById(`input-${id}`).value.trim();
        const resultDiv = document.getElementById(`result-${id}`);
        const task = tasks.find(t => t.id === id);

        // Сравниваем хеш введенного текста с хешем флага
        if (getHash(input) === task.hash) {
            resultDiv.textContent = "Флаг принят! Отличная работа.";
            resultDiv.className = "result correct";
            document.getElementById(`input-${id}`).style.borderColor = "#16a34a";
        } else {
            resultDiv.textContent = "Неверный флаг. Попробуй еще раз.";
            resultDiv.className = "result incorrect";
            document.getElementById(`input-${id}`).style.borderColor = "#dc2626";
        }
    }
</script>

<!-- Секретный комментарий для Задания 2: flag{inspector_gadget} -->

</body>
</html>
